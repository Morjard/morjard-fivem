<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morjard — Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
    --accent:  #00e5cc;
    --accent2: #00b8ff;
    --danger:  #ff3b3b;
    --warn:    #ffb020;
    --bg:      #08111a;
    --bg2:     #0d1c27;
    --border:  rgba(0,229,204,0.18);
    --borderB: rgba(0,229,204,0.45);
    --text:    #e8f4f0;
    --textDim: rgba(200,230,225,0.5);
    --mono:    'Share Tech Mono', monospace;
    --main:    'Rajdhani', sans-serif;
    --gap:     14px;
}

*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }

html, body {
    width:100%; height:100%;
    background:var(--bg);
    overflow:hidden;
    font-family:var(--main);
    color:var(--text);
    user-select:none;
}

body::before {
    content:'';
    position:fixed; inset:0;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);
    pointer-events:none; z-index:9000;
}

/* ── Background ── */
.bg-grid {
    position:fixed; inset:0;
    background-image:
        linear-gradient(rgba(0,229,204,0.032) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,229,204,0.032) 1px,transparent 1px);
    background-size:60px 60px;
    z-index:0;
    animation:gridDrift 60s linear infinite;
}
@keyframes gridDrift { from{background-position:0 0} to{background-position:60px 60px} }

.bg-glow {
    position:fixed; width:600px; height:600px; border-radius:50%;
    filter:blur(120px); pointer-events:none; z-index:0;
}
.bg-glow.tl { top:-200px; left:-200px; background:rgba(0,229,204,0.055); }
.bg-glow.br { bottom:-200px; right:-200px; background:rgba(0,184,255,0.055); }

/* ── Done overlay ── */
.done-overlay {
    position:fixed; inset:0; z-index:8000;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .5s;
    background:rgba(0,229,204,0.04);
}
.done-overlay.show { opacity:1; }
.done-pulse { font-family:var(--mono); font-size:14px; letter-spacing:6px; color:var(--accent); animation:blink 1s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

/* Corner brackets */
.cb { position:absolute; width:10px; height:10px; border-color:var(--accent); border-style:solid; opacity:.42; pointer-events:none; }
.cb.tl { top:0;    left:0;  border-width:1px 0 0 1px; }
.cb.tr { top:0;    right:0; border-width:1px 1px 0 0; }
.cb.bl { bottom:0; left:0;  border-width:0 0 1px 1px; }
.cb.br { bottom:0; right:0; border-width:0 1px 1px 0; }
.cb.fat { width:13px; height:13px; opacity:1; border-width:2px !important; }

@keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
@keyframes pulseDot { 0%,100%{opacity:1} 50%{opacity:.25} }

/* ── Screen ── */
.screen { position:relative; z-index:1; width:100%; height:100%; display:flex; flex-direction:column; }

/* ══ TOP BAR ══ */
.top-bar {
    height:56px; flex-shrink:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 22px;
    border-bottom:1px solid var(--border);
}
.top-bar-logo { display:flex; align-items:center; gap:12px; }
.logo-icon-wrap {
    width:36px; height:36px; border:1px solid var(--borderB);
    display:flex; align-items:center; justify-content:center; position:relative; flex-shrink:0;
}
.logo-icon-wrap::before { content:''; position:absolute; inset:-4px; border:1px solid rgba(0,229,204,0.1); pointer-events:none; }
.logo-icon { font-size:15px; color:var(--accent); }
.logo-texts { display:flex; flex-direction:column; line-height:1; }
.logo-title  { font-size:18px; font-weight:700; letter-spacing:4px; color:var(--text); }
.logo-title .hi { color:var(--accent); }
.logo-sub    { font-family:var(--mono); font-size:8px; color:var(--textDim); letter-spacing:2px; margin-top:2px; }

.top-right { display:flex; align-items:center; gap:18px; }
.status-item { display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:9px; color:var(--textDim); letter-spacing:1.5px; }
.status-dot  { width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); animation:pulseDot 2s ease-in-out infinite; }
.clock { color:var(--accent); font-family:var(--mono); font-size:10px; letter-spacing:2px; }

/* Music */
.music-ctrl { display:flex; align-items:center; gap:7px; padding:4px 10px; border:1px solid var(--border); background:rgba(8,17,26,.55); }
.music-btn  { background:transparent; border:none; color:var(--textDim); font-size:13px; cursor:pointer; padding:1px 3px; transition:color .2s; line-height:1; }
.music-btn:hover,.music-btn.on { color:var(--accent); }
.vol-wrap   { width:60px; }
.vol-slider {
    -webkit-appearance:none; width:100%; height:3px;
    background:rgba(0,229,204,0.15); outline:none; cursor:pointer; border-radius:2px; display:block;
}
.vol-slider::-webkit-slider-thumb { -webkit-appearance:none; width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 5px var(--accent); cursor:pointer; }
.vol-slider::-moz-range-thumb    { width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 5px var(--accent); border:none; cursor:pointer; }
.vol-lbl    { font-family:var(--mono); font-size:8px; color:var(--textDim); min-width:24px; text-align:right; }

/* Lang */
.lang-sw    { display:flex; gap:4px; }
.lang-btn   { padding:2px 7px; border:1px solid var(--border); background:transparent; color:var(--textDim); font-family:var(--mono); font-size:9px; letter-spacing:1px; cursor:pointer; transition:border-color .2s,color .2s,background .2s; }
.lang-btn:hover,.lang-btn.on { border-color:var(--accent); color:var(--accent); background:rgba(0,229,204,0.07); }

/* ══ MAIN ══ */
.main { flex:1; display:flex; padding:var(--gap) 22px 12px; gap:var(--gap); overflow:hidden; min-height:0; }

/* ── LEFT ── */
.left  { flex:1; min-width:0; display:flex; flex-direction:column; gap:var(--gap); }

/* Identity */
.identity {
    border:1px solid var(--border); background:rgba(13,28,39,.72); position:relative;
    padding:12px 16px; animation:fadeUp .5s ease both; flex-shrink:0;
}
.id-inner { display:flex; align-items:center; justify-content:space-between; gap:16px; }
.srv-name { font-size:26px; font-weight:700; letter-spacing:5px; line-height:1; color:var(--text); }
.srv-name .hi { color:var(--accent); }
.srv-tag  { font-family:var(--mono); font-size:8px; color:var(--textDim); letter-spacing:1.5px; margin-top:5px; }
.srv-stats { display:flex; gap:18px; align-items:center; flex-shrink:0; }
.stat { display:flex; flex-direction:column; gap:2px; }
.stat-val { font-size:17px; font-weight:700; color:var(--accent); line-height:1; }
.stat-val.b { color:var(--accent2); }
.stat-val.w { color:var(--warn); }
.stat-lbl { font-family:var(--mono); font-size:7px; color:var(--textDim); letter-spacing:2px; }
.social-btns { display:flex; flex-direction:column; gap:5px; }
.social-btn {
    display:flex; align-items:center; justify-content:center; gap:6px;
    padding:5px 12px; border:1px solid var(--border); background:transparent;
    font-family:var(--mono); font-size:8px; color:var(--textDim); letter-spacing:1.5px;
    cursor:pointer; transition:border-color .2s,color .2s,background .2s; white-space:nowrap;
}
.social-btn:hover { border-color:var(--accent); color:var(--accent); background:rgba(0,229,204,0.07); }

/* 3-col panels */
.panels { flex:1; display:grid; grid-template-columns:1fr 1fr 1fr; gap:var(--gap); min-height:0; }
.panel  {
    border:1px solid var(--border); background:rgba(13,28,39,.72); position:relative;
    display:flex; flex-direction:column; overflow:hidden; min-height:0;
}
.panel.d1 { animation:fadeUp .5s .06s ease both; }
.panel.d2 { animation:fadeUp .5s .12s ease both; }
.panel.d3 { animation:fadeUp .5s .18s ease both; }
.panel-hdr {
    display:flex; align-items:center; gap:7px; padding:10px 13px 8px;
    border-bottom:1px solid var(--border);
    font-family:var(--mono); font-size:9px; font-weight:700; letter-spacing:2.5px; color:var(--accent);
    flex-shrink:0;
}
.panel-hdr .ico { font-size:10px; }
.panel-body {
    flex:1; overflow-y:auto; overflow-x:hidden; padding:9px 13px 11px;
    display:flex; flex-direction:column; gap:6px;
}
.panel-body::-webkit-scrollbar { width:2px; }
.panel-body::-webkit-scrollbar-thumb { background:rgba(0,229,204,.3); border-radius:2px; }

/* Rules */
.rule { display:flex; align-items:flex-start; gap:9px; font-size:11px; font-weight:500; color:var(--text); line-height:1.4; }
.rule-n { font-family:var(--mono); font-size:8px; color:var(--accent); min-width:18px; padding-top:2px; flex-shrink:0; }

/* Updates */
.upd { border-left:2px solid var(--border); padding:7px 9px; background:rgba(8,17,26,.45); animation:fadeUp .3s ease both; }
.upd.PATCH  { border-left-color:var(--accent2); }
.upd.UPDATE { border-left-color:var(--accent); }
.upd.HOTFIX { border-left-color:var(--danger); }
.upd.MAJOR  { border-left-color:var(--warn); }
.upd-head { display:flex; align-items:center; gap:6px; margin-bottom:3px; }
.upd-ver  { font-family:var(--mono); font-size:9px; font-weight:700; color:var(--accent); }
.upd-tag  { font-family:var(--mono); font-size:7px; letter-spacing:1px; padding:1px 5px; border:1px solid; }
.upd-tag.PATCH  { color:var(--accent2); border-color:rgba(0,184,255,.35); }
.upd-tag.UPDATE { color:var(--accent);  border-color:rgba(0,229,204,.35); }
.upd-tag.HOTFIX { color:var(--danger);  border-color:rgba(255,59,59,.35); }
.upd-tag.MAJOR  { color:var(--warn);    border-color:rgba(255,176,32,.35); }
.upd-date { margin-left:auto; font-family:var(--mono); font-size:7px; color:var(--textDim); }
.upd-txt  { font-size:10px; font-weight:500; color:rgba(200,230,225,.7); line-height:1.4; }

/* Events */
.evt { border:1px solid var(--border); background:rgba(8,17,26,.45); padding:8px 10px; animation:fadeUp .3s ease both; }
.evt-head { display:flex; align-items:center; gap:8px; margin-bottom:3px; }
.evt-ico  { width:24px; height:24px; flex-shrink:0; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:10px; }
.evt-ico.active { border-color:rgba(0,229,204,.5); color:var(--accent); background:rgba(0,229,204,.06); }
.evt-ico.soon   { border-color:rgba(255,176,32,.4); color:var(--warn);   background:rgba(255,176,32,.06); }
.evt-ico.past   { border-color:rgba(200,230,225,.12); color:var(--textDim); }
.evt-info { flex:1; min-width:0; }
.evt-name { font-size:11px; font-weight:700; color:var(--text); letter-spacing:1px; }
.evt-badge { font-family:var(--mono); font-size:7px; letter-spacing:1.5px; padding:1px 5px; border:1px solid; display:inline-block; margin-top:1px; }
.evt-badge.active { color:var(--accent); border-color:rgba(0,229,204,.4); }
.evt-badge.soon   { color:var(--warn);   border-color:rgba(255,176,32,.4); }
.evt-badge.past   { color:var(--textDim); border-color:rgba(200,230,225,.15); }
.evt-date { font-family:var(--mono); font-size:7px; color:var(--textDim); margin-bottom:3px; }
.evt-desc { font-size:10px; font-weight:500; color:rgba(200,230,225,.65); line-height:1.4; }

/* ── RIGHT ── */
.right { width:285px; flex-shrink:0; display:flex; flex-direction:column; gap:var(--gap); }

/* Loading box */
.load-box {
    border:1px solid var(--borderB); background:rgba(13,28,39,.9);
    padding:16px 16px 14px; position:relative; flex:1;
    display:flex; flex-direction:column;
    animation:fadeUp .5s .08s ease both;
}
.load-box .cb.fat.tl { border-width:2px 0 0 2px !important; }
.load-box .cb.fat.tr { border-width:2px 2px 0 0 !important; }
.load-box .cb.fat.bl { border-width:0 0 2px 2px !important; }
.load-box .cb.fat.br { border-width:0 2px 2px 0 !important; }

.load-hdr { display:flex; align-items:center; gap:8px; margin-bottom:14px; font-family:var(--mono); font-size:9px; font-weight:700; letter-spacing:2.5px; color:var(--accent); }
.load-hdr .ico { animation:pulseDot 2s ease-in-out infinite; }

/* Spinner */
.spin-wrap  { display:flex; justify-content:center; margin-bottom:14px; }
.spin-outer { width:76px; height:76px; position:relative; display:flex; align-items:center; justify-content:center; }
.spin-ring  { position:absolute; inset:0; border-radius:50%; border:1px solid rgba(0,229,204,.1); }
.spin-ring.r1 { border-top-color:var(--accent); animation:spin 1.4s linear infinite; }
.spin-ring.r2 { inset:9px; border-right-color:var(--accent2); border-top-color:transparent; animation:spin 2s linear infinite reverse; }
.spin-ring.r3 { inset:18px; border-bottom-color:rgba(0,229,204,.5); border-top-color:transparent; animation:spin 2.8s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }
.spin-pct { font-family:var(--mono); font-size:16px; font-weight:700; color:var(--accent); }

/* Progress */
.prog-lbl  { font-family:var(--mono); font-size:8px; color:var(--textDim); letter-spacing:2px; margin-bottom:5px; }
.prog-track { height:3px; background:rgba(0,229,204,.1); margin-bottom:8px; position:relative; overflow:visible; }
.prog-fill  { height:100%; background:var(--accent); box-shadow:0 0 10px var(--accent); transition:width .35s ease; position:relative; }
.prog-fill::after { content:''; position:absolute; right:-1px; top:50%; transform:translateY(-50%); width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); }
.segs { display:flex; gap:3px; margin-bottom:10px; }
.seg  { flex:1; height:3px; background:rgba(0,229,204,.1); transition:background .25s; }
.seg.on { background:var(--accent); box-shadow:0 0 5px var(--accent); }
.hdiv {
    display:flex; align-items:center; gap:7px; margin-bottom:8px;
    font-family:var(--mono); font-size:8px; color:var(--textDim); letter-spacing:2px;
}
.hdiv::before,.hdiv::after { content:''; flex:1; height:1px; background:var(--border); }
.log-wrap { flex:1; overflow:hidden; display:flex; flex-direction:column; gap:3px; }
.log-entry { font-family:var(--mono); font-size:8px; color:var(--textDim); letter-spacing:.8px; display:flex; gap:7px; opacity:0; animation:logIn .35s ease forwards; }
.log-entry.ok   .log-tag { color:var(--accent); }
.log-entry.warn .log-tag { color:var(--warn); }
.log-entry.err  .log-tag { color:var(--danger); }
.log-tag { min-width:36px; }
@keyframes logIn { to{opacity:1} }

/* Staff */
.staff-box {
    border:1px solid var(--border); background:rgba(13,28,39,.72); position:relative;
    display:flex; flex-direction:column; flex-shrink:0;
    animation:fadeUp .5s .16s ease both;
}
.staff-hdr { display:flex; align-items:center; gap:7px; padding:10px 14px 0; font-family:var(--mono); font-size:9px; font-weight:700; letter-spacing:2.5px; color:var(--accent); }
.staff-grid { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--border); border-top:1px solid var(--border); margin-top:8px; }
.staff-item { display:flex; align-items:center; gap:7px; padding:7px 9px; background:rgba(13,28,39,.9); transition:background .2s; }
.staff-item:hover { background:rgba(0,229,204,.04); }
.staff-av { width:26px; height:26px; flex-shrink:0; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:8px; font-weight:700; color:var(--accent); background:rgba(0,229,204,.05); position:relative; }
.s-dot { position:absolute; bottom:-2px; right:-2px; width:7px; height:7px; border-radius:50%; border:1px solid var(--bg2); }
.s-dot.online  { background:#2ecc71; box-shadow:0 0 5px #2ecc71; }
.s-dot.away    { background:var(--warn); box-shadow:0 0 4px var(--warn); }
.s-dot.offline { background:rgba(200,230,225,.2); }
.staff-info { min-width:0; }
.staff-name { font-size:10px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.staff-role { font-family:var(--mono); font-size:7px; color:var(--accent); letter-spacing:1px; margin-top:1px; }

/* ══ BOTTOM BAR ══ */
.bot-bar { height:36px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:0 22px; border-top:1px solid var(--border); }
.bot-tip { font-family:var(--mono); font-size:8px; color:var(--textDim); letter-spacing:1.5px; transition:opacity .45s; }
.bot-tip .hi { color:var(--accent); }
.bot-tip.fade { opacity:0; }
.bot-ver { font-family:var(--mono); font-size:8px; color:rgba(0,229,204,.28); letter-spacing:2px; }
/* ══ GALLERY ══ */
.gallery-box {
    border:1px solid var(--border); background:rgba(13,28,39,.72); position:relative;
    display:flex; flex-direction:column; flex-shrink:0;
    animation:fadeUp .5s ease both;
}
.gallery-track {
    position:relative; overflow:hidden;
    height:130px; flex-shrink:0;
}
.gallery-slides {
    display:flex; height:100%;
    transition:transform .5s cubic-bezier(.4,0,.2,1);
}
.gal-slide {
    min-width:100%; height:100%; flex-shrink:0;
    background-size:cover; background-position:center;
    position:relative;
}
.gal-slide::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(to top, rgba(8,17,26,.6) 0%, transparent 50%);
}
.gal-arrow {
    position:absolute; top:50%; transform:translateY(-50%);
    background:rgba(8,17,26,.7); border:1px solid var(--border);
    color:var(--textDim); width:26px; height:26px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:10px; z-index:10;
    transition:color .2s, border-color .2s, background .2s;
}
.gal-arrow:hover { color:var(--accent); border-color:var(--accent); background:rgba(0,229,204,.1); }
.gal-arrow.left  { left:8px; }
.gal-arrow.right { right:8px; }
.gal-dots {
    position:absolute; bottom:7px; left:50%; transform:translateX(-50%);
    display:flex; gap:5px; z-index:10;
}
.gal-dot {
    width:5px; height:5px; border-radius:50%;
    background:rgba(200,230,225,.3); cursor:pointer;
    transition:background .25s, transform .25s;
}
.gal-dot.on { background:var(--accent); transform:scale(1.3); }
</style>
<!-- additive hybrid Morjard/DDCZ style bridge, see ../../morjard-settings -->
<script>
window.addEventListener('message', function (event) {
    var data = event.data || {};
    if (data.type !== 'applyMorjardStyle' || !data.style) return;
    var root = document.documentElement.style;
    if (data.style.accent)    root.setProperty('--accent', data.style.accent);
    if (data.style.accentAlt) root.setProperty('--accent2', data.style.accentAlt);
});
</script>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow tl"></div>
<div class="bg-glow br"></div>
<div class="done-overlay" id="doneOverlay"><div class="done-pulse">CONNECTED</div></div>
<audio id="bgMusic" src="song.mp3" loop preload="auto"></audio>

<div class="screen">

  <!-- TOP BAR -->
  <header class="top-bar">
    <div class="top-bar-logo">
      <div class="logo-icon-wrap">
        <i class="fas fa-shield-halved logo-icon"></i>
      </div>
      <div class="logo-texts">
        <div class="logo-title">Mor<span class="hi">jard</span></div>
        <div class="logo-sub">ROLEPLAY &middot; FIVEM PLATFORM</div>
      </div>
    </div>
    <div class="top-right">
      <div class="status-item"><div class="status-dot"></div><span id="statusOnline">SERVER ONLINE</span></div>
      <div class="clock" id="clock">00:00:00</div>
      <div class="music-ctrl">
        <button class="music-btn" id="musicBtn"><i class="fas fa-volume-xmark" id="musicIcon"></i></button>
        <div class="vol-wrap"><input type="range" class="vol-slider" id="volSlider" min="0" max="100" value="5"></div>
        <span class="vol-lbl" id="volLbl">5%</span>
      </div>
      <div class="status-item">
        <i class="fas fa-language" style="color:var(--accent);font-size:11px;"></i>
        <div class="lang-sw" id="langSw"></div>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main">
    <div class="left">

      <!-- Identity -->
      <div class="identity">
        <div class="cb tl"></div><div class="cb tr"></div><div class="cb bl"></div><div class="cb br"></div>

/* ── Apply locale ── */
function applyLocale() {
    $('statusOnline').textContent = L.status_online;
    $('srvName').innerHTML = L.server_name.replace('Morjard','Mor<span class="hi">jard</span>');
    $('srvTag').textContent  = L.server_tagline;

    $('lbl-gallery').textContent  = L.tab_gallery  || 'GALLERY';
    $('loadHdr').textContent     = L.loading_header;
    buildRules(); buildUpdates(); buildEvents(); buildStaff();
    applyTip();
}

function setLang(lang) {
    if (!LOCALES[lang]) return;
    L = LOCALES[lang];
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
    applyLocale();
}

/* ── Build sections ── */
function buildRules() {
    const el = $('rulesList'); el.innerHTML='';
    L.rules.forEach((r,i) => {
        const d=document.createElement('div'); d.className='rule';
        d.innerHTML=`<span class="rule-n">${String(i+1).padStart(2,'0')}</span><span>${r}</span>`;
        el.appendChild(d);
    });
}

    const el = $('updatesList'); el.innerHTML='';
    L.updates.forEach((u,i) => {
        const d=document.createElement('div'); d.className=`upd ${u.tag}`; d.style.animationDelay=`${i*.06}s`;
        d.innerHTML=`<div class="upd-head"><span class="upd-ver">${u.version}</span><span class="upd-tag ${u.tag}">${u.tag}</span><span class="upd-date">${u.date}</span></div><div class="upd-txt">${u.text}</div>`;
        el.appendChild(d);
    });
}

function buildEvents() {
    const el = $('eventsList'); el.innerHTML='';
    L.events.forEach((ev,i) => {
        const d=document.createElement('div'); d.className='evt'; d.style.animationDelay=`${i*.06}s`;
        d.innerHTML=`<div class="evt-head"><div class="evt-ico ${ev.status}"><i class="${ev.icon}"></i></div><div class="evt-info"><div class="evt-name">${ev.name}</div><span class="evt-badge ${ev.status}">${ev.status.toUpperCase()}</span></div></div><div class="evt-date">${ev.date}</div><div class="evt-desc">${ev.desc}</div>`;
        el.appendChild(d);
    });
}

function buildStaff() {
    const el = $('staffGrid'); el.innerHTML='';
    L.staff.forEach((s,i) => {
        const ini = s.name.replace(/[^A-Za-z0-9]/g,'').substring(0,2).toUpperCase();
        const d=document.createElement('div'); d.className='staff-item'; d.style.animationDelay=`${i*.04}s`;
        d.innerHTML=`<div class="staff-av">${ini}<div class="s-dot ${s.status}"></div></div><div class="staff-info"><div class="staff-name">${s.name}</div><div class="staff-role">${s.role}</div></div>`;
        el.appendChild(d);
    });
}

/* ── Tips ── */
function applyTip() {
    const t = L.tips[tipIdx % L.tips.length];
    $('tipEl').innerHTML = `<span class="hi">${L.tip_prefix}</span> ${t}`;
}
setInterval(() => {
    const el = $('tipEl');
    el.classList.add('fade');
    setTimeout(() => { tipIdx=(tipIdx+1)%L.tips.length; applyTip(); el.classList.remove('fade'); }, 450);
}, CFG.tipInterval);

/* ── Lang switcher ── */
function initLang() {
    const c = $('langSw');
    CFG.langs.forEach(l => {
        const b = document.createElement('button');
        b.className = 'lang-btn' + (l===CFG.defaultLang?' on':'');
        b.textContent = l.toUpperCase(); b.dataset.l = l;
        b.onclick = () => setLang(l);
        c.appendChild(b);
    });
}

/* ── Clock ── */
setInterval(() => {
    const n=new Date();
    $('clock').textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':');
},1000);

/* ── Music ── */
function initMusic() {
    const au=$('bgMusic'), btn=$('musicBtn'), sl=$('volSlider'), lbl=$('volLbl');
    au.volume = CFG.volume; sl.value = Math.round(CFG.volume*100); lbl.textContent=Math.round(CFG.volume*100)+'%';
    let playing=false;
    const iconEl = document.getElementById('musicIcon');
    function updIcon() {
        if(!playing||au.muted)      iconEl.className='fas fa-volume-xmark';
        else if(au.volume<0.33)     iconEl.className='fas fa-volume-off';
        else if(au.volume<0.66)     iconEl.className='fas fa-volume-low';
        else                        iconEl.className='fas fa-volume-high';
    }
    function tryPlay() { au.play().then(()=>{ playing=true; btn.classList.add('on'); updIcon(); }).catch(()=>{}); }
    btn.onclick = () => { if(!playing){tryPlay();}else{au.muted=!au.muted; updIcon();} };
    sl.oninput  = () => { const v=parseInt(sl.value)/100; au.volume=v; au.muted=false; lbl.textContent=sl.value+'%'; if(!playing&&v>0)tryPlay(); updIcon(); };
    document.addEventListener('click',  tryPlay, {once:true});
    document.addEventListener('keydown',tryPlay, {once:true});
    tryPlay();
}

/* ── Segments ── */
function buildSegs() {
    const c=$('segs');
    for(let i=0;i<CFG.segments;i++){const d=document.createElement('div');d.className='seg';d.id='s'+i;c.appendChild(d);}
}
function setSegs(p) {
    const a=Math.round((p/100)*CFG.segments);
    for(let i=0;i<CFG.segments;i++) document.getElementById('s'+i)?.classList.toggle('on',i<a);
}

/* ── Animate pct ── */
function animPct(from,to,dur=350) {
    const t0=performance.now();
    (function tick(now){
        // Clamp both ends: an un-clamped lower bound let `t` go negative whenever
        // `now < t0` (observed with overlapping animPct() calls -- a later call's
        // rAF tick can still be in flight when an earlier call's tick fires), which
        // pulled `cur` far below 0 (e.g. displaying "-402%"). Found 2026-10-01 via
        // a headless screenshot pass, reproduced under both virtual and real time.
        const t=Math.max(0, Math.min((now-t0)/dur,1)), cur=Math.round(from+(to-from)*t);
        $('pct').textContent=cur+'%'; $('progFill').style.width=cur+'%'; setSegs(cur); pct=cur;
        if(t<1) requestAnimationFrame(tick);
    })(performance.now());
}

/* ── Log ── */
function addLog(line,type='ok') {
    const w=$('logWrap'),e=document.createElement('div'); e.className='log-entry '+type;
    const p=line.split(/  +/);
    e.innerHTML=`<span class="log-tag">[${p[0]}]</span><span>${p.slice(1).join(' ')||line}</span>`;
    w.appendChild(e);
    while(w.children.length>CFG.logMax) w.removeChild(w.firstChild);
}

/* ── Steps ── */
function nextStep() {
    if(done||realProg) return;
    const steps=L.steps||[];
    if(stepIdx>=steps.length){finish();return;}
    const tp=Math.round(((stepIdx+1)/steps.length)*95);
    $('stepLbl').textContent=steps[stepIdx];
    addLog(L.log_lines?.[stepIdx]||`SYS   step ${stepIdx+1}`,'ok');
    animPct(pct,tp); stepIdx++;
    setTimeout(nextStep, CFG.stepMinMs+Math.random()*(CFG.stepMaxMs-CFG.stepMinMs));
}

function finish() {
    if(done) return; done=true;
    animPct(pct,100,500);
    setTimeout(()=>{
        $('stepLbl').textContent=L.loading_done||'CONNECTED';
        addLog('DONE  all systems ready','ok');
        const ov=$('doneOverlay'); ov.classList.add('show');
        setTimeout(()=>ov.classList.remove('show'),1500);
    },520);
}

/* ── NUI — FiveM sends eventName + loadFraction per official docs ── */
window.addEventListener('message', e => {
    if(!e.data) return;

    // Official FiveM loading progress event
    if(e.data.eventName === 'loadProgress') {
        realProg = true;
        const p = Math.round((e.data.loadFraction || 0) * 100);
        animPct(pct, Math.max(0, Math.min(100, p)));
        return;
    }

    // Official FiveM log line event
    if(e.data.eventName === 'onLogLine') {
        addLog('LOG   ' + (e.data.message || ''), 'ok');
        return;
    }

    // Our custom events from client.lua
    if(!e.data.type) return;
    if(e.data.type==='loadingDone'){finish();}
    else if(e.data.type==='setLang'&&CFG.langs.includes(e.data.lang)){setLang(e.data.lang);}
});

/* ── Gallery ─────────────────────────────────────────────────────
   Add/remove photos here. Path is relative to html/index.html.
   Format: { src: 'gallery/photoX.png', caption: 'optional text' }
----------------------------------------------------------------- */
const GALLERY_PHOTOS = [
    { src: 'gallery/photo1.png', caption: 'Morjard Zombie Apocalypsa' },
    { src: 'gallery/photo2.png', caption: 'Meteor Shower Event'    },
    { src: 'gallery/photo3.png', caption: 'WARNING: Tsunami!'      },
    { src: 'gallery/photo4.png', caption: 'Morjard Weather System'    },
];

let galIdx = 0;
let galTimer = null;

function buildGallery() {
    const slides = $('gallerySlides');
    const dots   = $('galDots');
    if (!slides || !GALLERY_PHOTOS.length) return;

    slides.innerHTML = '';
    dots.innerHTML   = '';

    GALLERY_PHOTOS.forEach((p, i) => {
        // slide
        const s = document.createElement('div');
        s.className = 'gal-slide';
        s.style.backgroundImage = `url('${p.src}')`;
        if (p.caption) {
            const c = document.createElement('div');
            c.style.cssText = 'position:absolute;bottom:8px;left:12px;right:40px;z-index:11;font-family:var(--mono);font-size:8px;color:rgba(200,230,225,.8);letter-spacing:1.5px;text-shadow:0 1px 4px rgba(0,0,0,.8);';
            c.textContent = p.caption.toUpperCase();
            s.appendChild(c);
        }
        slides.appendChild(s);

        // dot
        const d = document.createElement('div');
        d.className = 'gal-dot' + (i === 0 ? ' on' : '');
        d.onclick = () => galTo(i);
        dots.appendChild(d);
    });

    $('galPrev').onclick = () => galTo((galIdx - 1 + GALLERY_PHOTOS.length) % GALLERY_PHOTOS.length);
    $('galNext').onclick = () => galTo((galIdx + 1) % GALLERY_PHOTOS.length);

    galStartAuto();
}

function galTo(idx) {
    galIdx = idx;
    $('gallerySlides').style.transform = `translateX(-${idx * 100}%)`;
    document.querySelectorAll('.gal-dot').forEach((d, i) => d.classList.toggle('on', i === idx));
    galStartAuto();
}

function galStartAuto() {
    if (galTimer) clearInterval(galTimer);
    galTimer = setInterval(() => galTo((galIdx + 1) % GALLERY_PHOTOS.length), 5000);
}

/* ── Boot ── */
buildSegs(); initLang(); initMusic(); buildGallery(); setLang(CFG.defaultLang);
(function clockNow(){const n=new Date();$('clock').textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':');})();
setTimeout(nextStep,600);
</script>
